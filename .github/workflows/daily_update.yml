name: Daily Football Data & Elo Update

on:
  schedule:
    # Runs every day at 06:00 UTC (2:00 PM Philippine Time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows you to trigger an update manually anytime with a button click on GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install soccerdata beautifulsoup4 wrapper-tls-requests

      - name: [1/2] Updating Match and Injury Data
        run: python data_ingestion.py

      - name: [2/2] Recalculating Elo and Form Features
        run: python feature_engineering.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily match & Elo data update" && git push)
