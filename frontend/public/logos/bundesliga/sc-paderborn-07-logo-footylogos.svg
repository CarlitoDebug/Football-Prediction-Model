<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="badge-clip">
      <circle cx="256" cy="256" r="246" />
    </clipPath>
  </defs>
  <!-- Base Circle -->
  <circle cx="256" cy="256" r="246" fill="#ffffff" stroke="#000000" stroke-width="12" />
  
  <g clip-path="url(#badge-clip)">
    <!-- Blue Top Arch Accent -->
    <path d="M 80 216 A 246 246 0 0 1 432 216 H 392 A 206 206 0 0 0 120 216 Z" fill="#005ca8" />

    <!-- Top Text: SC -->
    <text x="256" y="160" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="88" fill="#000000" letter-spacing="4">SC</text>

    <!-- Center Black Banner -->
    <rect x="0" y="216" width="512" height="80" fill="#000000" />
    <text x="256" y="274" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="50" fill="#ffffff" letter-spacing="6">PADERBORN</text>

    <!-- Bottom Blue Area -->
    <path d="M 0 296 H 512 V 512 H 0 Z" fill="#005ca8" />
    <text x="256" y="415" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="112" fill="#ffffff" letter-spacing="2">07</text>
  </g>
  
  <!-- Outer Ring Overlay -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="#000000" stroke-width="12" />
</svg>
